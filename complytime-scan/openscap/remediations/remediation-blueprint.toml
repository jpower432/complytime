name = "hardened_xccdf_org.ssgproject.content_profile_cis_workstation_l1"
description = "DRAFT - CIS Fedora Benchmark for Level 1 - Workstation"
version = "0.1.79"

[customizations.openscap]
profile_id = "xccdf_org.ssgproject.content_profile_cis_workstation_l1"
# If your hardening data stream is not part of the 'scap-security-guide' package
# provide the absolute path to it (from the root of the image filesystem).
# datastream = "/usr/share/xml/scap/ssg/content/ssg-xxxxx-ds.xml"


[[packages]]
name = "aide"
version = "*"

[[customizations.filesystem]]
mountpoint = "/tmp"
size = 1073741824

[[packages]]
name = "sudo"
version = "*"

[[packages]]
name = "libpwquality"
version = "*"

[[packages]]
name = "systemd-journal-remote"
version = "*"

[[packages]]
name = "firewalld"
version = "*"

[[packages]]
name = "nftables"
version = "*"

[[packages]]
name = "libselinux"
version = "*"

[[packages]]
name = "cron"
version = "*"

[customizations.kernel]
append = ""

[customizations.services]
enabled = ["crond","firewalld","systemd-journald"]
disabled = []
masked = ["nfs-server","rpcbind","nftables"]


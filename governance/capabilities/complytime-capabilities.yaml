metadata:
  id: CT.COMPLYCTL
  type: CapabilityCatalog
  gemara-version: 1.0.0-rc.0
  version: 0.1.0
  description: >
    ComplyTime CLI capabilities for the Gemara-native workflow: OCI artifact
    retrieval, plugin subprocess and gRPC communication, workspace configuration,
    policy graph resolution, target variable injection, and assessment reporting.
  author:
    id: jpower432
    name: Jenn Power
    type: Software Assisted
  mapping-references:
    - description: |
        Foundational repository of reusable security controls, capabilities, and threat models maintained by FINOS.
      id: CCC
      title: Common Cloud Controls Core
      url: https://github.com/finos/common-cloud-controls/releases
      version: v2025.10
title: ComplyTime Gemara-Native Capability Catalog
groups:
  - id: CT.COMPLYCTL.GRP01
    title: ComplyTime CLI Gemara-native workflow
    description: >
      OCI policy consumption, plugin execution, workspace configuration,
      and assessment reporting for complyctl.
capabilities:
  - id: CT.COMPLYCTL.CAP01
    title: OCI Artifact Retrieval
    description: |
      Fetch policy artifacts (catalogs, guidance, policy layers) from OCI-compliant registries using oras-go. Supports credential-based authentication via the Docker credential chain and plain HTTP fallback.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP02
    title: Plugin Subprocess Execution
    description: |
      Discover plugin binaries matching the naming convention (complyctl-provider-*) in a configured directory, launch them as subprocesses via hashicorp/go-plugin, and manage their lifecycle.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP03
    title: gRPC Plugin Communication
    description: |
      Exchange assessment configurations, scan requests, and evaluation results between the host CLI and plugin subprocesses over gRPC channels with AutoMTLS enabled by hashicorp/go-plugin.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP04
    title: Workspace Configuration Loading
    description: |
      Parse the complytime.yaml workspace configuration file including environment variable expansion (${VAR} syntax) for target variables containing credentials and connection strings.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP05
    title: Policy Graph Resolution
    description: |
      Resolve cached OCI layers into a policy graph structure, extract assessment configurations, and group them by evaluator ID for plugin routing.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP06
    title: Target Variable Injection
    description: |
      Pass target-specific variables (authentication tokens, connection strings, environment identifiers) from workspace configuration through the plugin gRPC interface to assessment evaluators.
    group: CT.COMPLYCTL.GRP01
  - id: CT.COMPLYCTL.CAP07
    title: Assessment Report Generation
    description: |
      Write evaluation results to the local filesystem in multiple formats under the specified output directory.
    group: CT.COMPLYCTL.GRP01
imports:
  - entries:
      - reference-id: CCC.Core.CP29
        remarks: Active Ingestion
      - reference-id: CCC.Core.CP18
        remarks: Resource Versioning
    reference-id: CCC

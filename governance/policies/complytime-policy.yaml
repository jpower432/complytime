title: ComplyTime CLI Security Policy

metadata:
  id: CT.COMPLYCTL.POL01
  type: Policy
  gemara-version: "1.0.0-rc.0"
  description: >
    Security policy for the complytime CLI establishing control import
    requirements, risk decisions, and assessment plans for the Gemara-native
    workflow.
  version: "0.1.0"
  author:
    id: complytime-team
    name: ComplyTime
    type: Software Assisted
    uri: https://github.com/complytime/complytime
  mapping-references:
    - id: CT.COMPLYCTL.CTRL
      title: ComplyTime Gemara-Native Redesign Control Catalog
      version: "0.1.0"
      url: https://github.com/complytime/complytime
      description: >
        Security controls for the complytime CLI Gemara-native workflow (v1).
    - id: CT.COMPLYCTL
      title: ComplyTime Gemara-Native Threat Catalog
      version: "0.1.0"
      url: https://github.com/complytime/complytime
      description: >
        Threat catalog for the Gemara-native workflow (v1); capabilities in
        governance/capabilities/complytime-capabilities.yaml.

contacts:
  responsible:
    - name: ComplyTime Maintainers
      social: https://github.com/orgs/complytime/teams/maintainers
  accountable:
    - name: ComplyTime Maintainers
      social: https://github.com/orgs/complytime/teams/maintainers

scope:
  in:
    technologies:
      - complytime CLI
      - hashicorp/go-plugin
      - OCI registries
      - gRPC

imports:
  catalogs:
    - reference-id: CT.COMPLYCTL.CTRL

# Risk catalog not used; threats referenced via mapping-references CT.COMPLYCTL.
risks:
  mitigated:
    - id: CT.COMPLYCTL.POL01.MIT.THR02
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR02
    - id: CT.COMPLYCTL.POL01.MIT.THR03
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR03
    - id: CT.COMPLYCTL.POL01.MIT.THR06
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR06
    - id: CT.COMPLYCTL.POL01.MIT.THR04
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR04
    - id: CT.COMPLYCTL.POL01.MIT.THR05
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR05
    - id: CT.COMPLYCTL.POL01.MIT.THR07
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR07
    - id: CT.COMPLYCTL.POL01.MIT.THR08
      risk:
        reference-id: CT.COMPLYCTL
        entry-id: CT.COMPLYCTL.THR08

adherence:
  evaluation-methods:
    - id: CT.COMPLYCTL.POL01.EV.CI
      type: Behavioral
      mode: Automated
      required: true
      description: >
        Behavioral e2e tests produce a Gemara EvaluationLog and SARIF report
        against the control catalog on every pull request.
      executor:
        id: complytime-behavioral
        name: complytime-behavioral
        type: Software
        version: "0.1.0"
        uri: https://github.com/complytime/complytime
  assessment-plans:
    - id: CT.COMPLYCTL.POL01.AP01
      requirement-id: CT.COMPLYCTL.CTRL01.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP01.EV
          type: Behavioral
          mode: Automated
          description: Verifies cryptographic signature validation on fetched policy content.
    - id: CT.COMPLYCTL.POL01.AP04
      requirement-id: CT.COMPLYCTL.CTRL02.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP04.EV
          type: Behavioral
          mode: Automated
          description: Verifies digest recording in state.json.
    - id: CT.COMPLYCTL.POL01.AP05
      requirement-id: CT.COMPLYCTL.CTRL02.AR02
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP05.EV
          type: Behavioral
          mode: Automated
          description: Verifies OCI layout structure.
    - id: CT.COMPLYCTL.POL01.AP06
      requirement-id: CT.COMPLYCTL.CTRL03.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP06.EV
          type: Behavioral
          mode: Automated
          description: Verifies failure on unset env var.
    - id: CT.COMPLYCTL.POL01.AP07
      requirement-id: CT.COMPLYCTL.CTRL03.AR02
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP07.EV
          type: Behavioral
          mode: Automated
          description: Verifies env var resolution.
    - id: CT.COMPLYCTL.POL01.AP08
      requirement-id: CT.COMPLYCTL.CTRL04.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP08.EV
          type: Behavioral
          mode: Automated
          description: Verifies targeted plugin routing.
    - id: CT.COMPLYCTL.POL01.AP09
      requirement-id: CT.COMPLYCTL.CTRL04.AR02
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP09.EV
          type: Behavioral
          mode: Automated
          description: Verifies error on evaluator mismatch.
    - id: CT.COMPLYCTL.POL01.AP10
      requirement-id: CT.COMPLYCTL.CTRL05.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP10.EV
          type: Behavioral
          mode: Automated
          description: Verifies http:// enables plainHTTP.
    - id: CT.COMPLYCTL.POL01.AP13
      requirement-id: CT.COMPLYCTL.CTRL05.AR02
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP13.EV
          type: Behavioral
          mode: Automated
          description: Verifies https:// does not enable plainHTTP.
    - id: CT.COMPLYCTL.POL01.AP11
      requirement-id: CT.COMPLYCTL.CTRL06.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP11.EV
          type: Behavioral
          mode: Automated
          description: Verifies EvaluationLog completeness.
    - id: CT.COMPLYCTL.POL01.AP12
      requirement-id: CT.COMPLYCTL.CTRL06.AR02
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP12.EV
          type: Behavioral
          mode: Automated
          description: Verifies error assessments in evaluation log output.
    - id: CT.COMPLYCTL.POL01.AP14
      requirement-id: CT.COMPLYCTL.CTRL07.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP14.EV
          type: Behavioral
          mode: Automated
          description: >
            Verifies plugin binary integrity check. Expected to fail — not implemented.
    - id: CT.COMPLYCTL.POL01.AP15
      requirement-id: CT.COMPLYCTL.CTRL08.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP15.EV
          type: Behavioral
          mode: Automated
          description: >
            Verifies plugin subprocess isolation. Expected to fail — not implemented.
    - id: CT.COMPLYCTL.POL01.AP16
      requirement-id: CT.COMPLYCTL.CTRL09.AR01
      frequency: per-pull-request
      evaluation-methods:
        - id: CT.COMPLYCTL.POL01.AP16.EV
          type: Behavioral
          mode: Automated
          description: Verifies log file does not contain plaintext credentials.

title: ComplyTime Gemara-Native Threat Catalog
groups:
  - id: CT.COMPLYCTL.GRP01
    title: ComplyTime CLI Gemara-native workflow
    description: >
      OCI policy consumption, plugin execution, workspace configuration,
      and assessment reporting for complyctl.
imports:
  - entries:
      - reference-id: CCC.Core.TH14
    reference-id: CCC
metadata:
  id: CT.COMPLYCTL
  type: ThreatCatalog
  gemara-version: 1.0.0-rc.0
  version: 0.1.0
  description: >
    Threat catalog for the complytime CLI redesign covering the Gemara-native
    workflow: OCI registry interaction, hashicorp/go-plugin subprocess execution,
    gRPC plugin communication, workspace configuration, policy caching, and
    assessment report generation.
  author:
    id: jpower432
    name: Jenn Power
    type: Software Assisted
  mapping-references:
    - description: |
        Foundational repository of reusable security controls, capabilities, and threat models maintained by FINOS.
      id: CCC
      title: Common Cloud Controls Core
      url: https://github.com/finos/common-cloud-controls/releases
      version: v2025.10
    - id: CT.COMPLYCTL
      title: ComplyTime Gemara-Native Capability Catalog
      version: 0.1.0
      description: Capabilities extracted from ComplyTime Gemara-Native Threat Catalog
threats:
  - id: CT.COMPLYCTL.THR02
    title: OCI Registry Artifact Tampering
    description: |
      Policy artifacts fetched by mutable tags (e.g., "latest") without content digest pinning allow a compromised or man-in-the-middle registry to serve malicious catalog, guidance, or policy layers. The cache sync stores whatever the registry serves without verifying content against a known-good digest.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CCC.Core.CP29
          - reference-id: CCC.Core.CP18
        reference-id: CCC
      - entries:
          - reference-id: CT.COMPLYCTL.CAP01
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR03
    title: Credential Exposure via Target Variable Transmission
    description: |
      Target variables carrying authentication tokens and connection strings are resolved from environment variables at config load time, serialized into gRPC messages, and transmitted to plugin subprocesses. This crosses a process boundary — every plugin receiving a routed request gains access to the target variables included in that request. Unresolved ${VAR} references that fail silently could mask missing credentials, and plaintext persistence in complytime.yaml widens the exposure surface.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP04
          - reference-id: CT.COMPLYCTL.CAP06
          - reference-id: CT.COMPLYCTL.CAP03
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR06
    title: Insecure Registry Transport Downgrade
    description: |
      The registry client automatically enables plainHTTP when the configured registry URL uses an http:// scheme, with no warning to the user. This exposes OCI manifest and blob traffic (including authentication credentials if configured) to network-level interception and modification.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP01
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR04
    title: Plugin Binary Substitution
    description: |
      An attacker with write access to the plugin directory can replace a legitimate complyctl-provider-* binary with a malicious executable. The current discovery mechanism matches only on filename prefix and executable permission — it does not verify binary integrity via digest, signature, or code-signing. A substituted binary inherits the host process's trust context including gRPC AutoMTLS and target variables.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP02
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR05
    title: Plugin Subprocess Privilege Escalation
    description: |
      Plugin subprocesses launched by hashicorp/go-plugin execute with the same OS-level privileges as the parent complyctl process. A compromised or malicious plugin can access all files, environment variables, and network resources available to the invoking user. No sandboxing, namespace isolation, or capability restrictions are applied to plugin processes.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP02
          - reference-id: CT.COMPLYCTL.CAP03
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR07
    title: Unverified Plugin Assessment Results
    description: |
      The host CLI accepts plugin-reported assessment results (pass/fail/skip/error) at face value with no independent verification. If a plugin produces incorrect results due to bugs, misconfiguration, or version skew, the evaluation log and downstream compliance reports will reflect those inaccuracies. Preserving raw step-level results enables downstream consumers to audit provenance and detect inconsistencies.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP03
          - reference-id: CT.COMPLYCTL.CAP07
        reference-id: CT.COMPLYCTL
  - id: CT.COMPLYCTL.THR08
    title: Log File Information Disclosure
    description: |
      The complyctl log file (complytime.log) captures structured log output including plugin communication details, configuration values, and error messages. If target variables containing credentials are logged at debug or info level — or appear in error messages — the log file becomes a secondary credential store readable by any process with access to the working directory.
    group: CT.COMPLYCTL.GRP01
    capabilities:
      - entries:
          - reference-id: CT.COMPLYCTL.CAP04
          - reference-id: CT.COMPLYCTL.CAP07
        reference-id: CT.COMPLYCTL
